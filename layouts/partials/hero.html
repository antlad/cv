{{ $hero := .Site.Data.home.hero }}
<section class="hero" id="top" aria-labelledby="hero-title">
  <div class="page-shell hero-grid">
    <div class="hero-copy">
      <p class="eyebrow">{{ $hero.eyebrow }}</p>
      <h1 id="hero-title">{{ $hero.title }}</h1>
      <p class="hero-summary">{{ $hero.summary }}</p>
      <div class="hero-actions">
        <a class="button button-primary" href="mailto:vladislav@troinich.pro">Discuss an engineering challenge</a>
        <a class="text-link" href="#experience">Explore experience <span aria-hidden="true">↓</span></a>
      </div>
      <ul class="hero-signals" aria-label="Working principles">
        {{ range $hero.signals }}
          <li>{{ . }}</li>
        {{ end }}
      </ul>
    </div>
    <div class="hero-visual">
      <div class="portrait-frame">
        <img src="{{ .Site.Params.avatar }}" alt="Vladislav Troinich" width="460" height="460" fetchpriority="high">
      </div>
    </div>
  </div>
</section>
