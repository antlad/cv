{{ $section := .Site.Data.home.contact }}
<section class="contact-section" id="contact" aria-labelledby="contact-title">
  <div class="page-shell contact-grid">
    <p class="section-number">05 / Contact</p>
    <div class="contact-copy">
      <h2 id="contact-title">{{ $section.title }}</h2>
      <p>{{ $section.description }}</p>
      <a class="button button-inverse" href="mailto:vladislav@troinich.pro">{{ $section.button }}</a>
    </div>
    <div class="contact-aside">
      <p class="mini-label">Direct</p>
      <a class="email-link" href="mailto:vladislav@troinich.pro">vladislav@troinich.pro</a>
      <p>Secure email: <a href="/email-pub.asc">download GPG key</a></p>
      <p class="cv-download"><a href="/cv.pdf" download>Download CV (PDF)</a></p>
    </div>
  </div>
</section>
