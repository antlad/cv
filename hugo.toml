baseURL = "https://troinich.pro/"
languageCode = "en-us"
title = "Vladislav Troinich — Lead Go Engineer & Software Architect"
disableKinds = ["taxonomy", "term"]

[markup.goldmark.renderer]
  unsafe = true

# Renders layouts/index.cv.html to /cv.html, the print source for
# /vladislav-troinich-cv.pdf.
# RSS must stay in the list: dropping it removes index.xml.
[outputFormats.CV]
  mediaType = "text/html"
  baseName = "cv"
  isHTML = true

# Renders layouts/index.llms.txt to /llms.txt — a plain-markdown summary
# for LLMs / AI answer engines (see llmstxt.org). Generated from data/home.yaml
# so it stays in sync with the visible page.
[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true

[outputs]
  home = ["HTML", "RSS", "CV", "LLMS"]

[params]
  description = "Lead Go engineer and hands-on software architect specializing in distributed systems, industrial and edge data platforms, reliability, performance, and edge-to-cloud delivery."
  name = "Vladislav Troinich"
  role = "Lead Go Engineer & Software Architect"
  avatar = "/images/profile.png"
  social_image = "/images/profile.png"

[[params.contacts]]
  icon = "email"
  label = "Email"
  url = "mailto:vladislav@troinich.pro"

