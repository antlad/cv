baseURL = "https://troinich.pro/"
languageCode = "en-us"
title = "Vladislav Troinich — Staff / Lead Software Engineer"
disableKinds = ["taxonomy", "term"]

# Serve the standalone RenderCV output in local previews and Hugo builds.
# CI generates a fresh PDF into public/ after the Hugo build.
[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "rendercv_output"
  target = "static"
  includeFiles = ["vladislav-troinich-cv.pdf"]

[markup.goldmark.renderer]
  unsafe = true

[pagination]
  pagerSize = 10

# Renders layouts/index.llms.txt to /llms.txt — a plain-markdown summary
# for LLMs / AI answer engines (see llmstxt.org). Generated from data/home.yaml
# so it stays in sync with the visible page.
[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true

[outputs]
  home = ["HTML", "RSS", "LLMS"]

[params]
  description = "Staff / Lead software engineer building distributed systems and data platforms in Go and C++. 18+ years in software engineering. Remote worldwide; B2B preferred."
  name = "Vladislav Troinich"
  role = "Staff / Lead Software Engineer"
  avatar = "/images/profile.png"
  social_image = "/images/profile.png"

