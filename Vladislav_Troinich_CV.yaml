# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
# Standalone CV source; experience highlights also supply the portal's bullets.
cv:
  name: Vladislav Troinich
  headline: Staff / Lead Software Engineer — Distributed Systems & Data Platforms
  location: Remote · Worldwide B2B · UTC+4 · Up to 6h US/EU overlap
  email: vladislav@troinich.pro
  website: https://troinich.pro/
  social_networks:
    - network: LinkedIn
      username: vladtr
    - network: GitHub
      username: antlad
  sections:
    profile:
      - >-
        Software engineer with 18+ years of experience, from C++ systems to Go
        data platforms. My work spans distributed storage, messaging, and data
        processing, combining architecture and technical leadership with
        implementation and performance analysis.
    experience:
      - company: Litmus Automation
        position: Lead Software Engineer
        start_date: 2020-10
        end_date: present
        summary: Industrial edge and data processing platform.
        highlights:
          - >-
            Lead technical work for a data engineering group of up to 10
            engineers, including two technical leads. Review API and data-model changes, plan
            migrations, and implement changes spanning collection, storage,
            and delivery. Conduct technical and system-design interviews for
            software engineers and give hiring recommendations.
          - >-
            Lead the response to urgent technical problems, deciding when to
            patch a system and when to replace its implementation based on
            risk, deadlines, and team capacity. Implement or delegate fixes
            and validate them with integration tests.
          - >-
            Designed and built independent cloud and enterprise connectors
            with their own persistent buffers, replacing centralized data
            delivery. Kept existing deployments compatible during migration.
          - >-
            Rebuilt connector persistence as a Go disk-backed FIFO/LIFO library
            using append-oriented files and recovery metadata. Simplified the
            implementation and improved recovery after outages.
          - >-
            Implemented MQTT broker clustering, then redesigned and implemented
            distributed message delivery while preserving MQTT semantics.
          - >-
            Designed embedded KV schemas and implemented storage migrations,
            including the move from BoltDB to BadgerDB. Designed and implemented
            internal gRPC and external GraphQL APIs.
          - >-
            Investigate CPU, memory, startup-time, and throughput problems
            using profiling and load testing across connectors, analytics,
            OPC UA, and device polling.
          - >-
            Standardized Data-team Go services around Uber Fx and shared
            libraries. Introduced container-based integration testing in CI,
            later adopting Testcontainers.
          - >-
            Established AI-assisted code review in GitLab with project-specific
            policies, linters, CI tests, and performance and security gates.
            Required checks block merges with significant issues; I review
            changes before final approval. This helped improve code quality
            and reduce bugs.
          - >-
            Use Claude daily for AI-assisted development, with custom skills
            for planning, implementation, debugging, and testing. Built issue
            monitoring tools and an experimental agent that turns tickets
            into merge requests for one repository.
      - company: Litmus Automation
        position: Senior Software Engineer
        start_date: 2017-11
        end_date: 2020-10
        highlights:
          - >-
            Stabilized the Python device-collection stack, then designed and
            built the Go controller and Go/C++ workers in 2018. Implemented
            the first Modbus, OPC UA, and BACnet drivers to validate the
            framework before other developers extended it. The architecture
            now supports all 250+ industrial drivers.
          - >-
            Designed and built the OPC UA server, combining a Go controller
            with C++ workers to use established OPC UA libraries.
          - >-
            Designed and built time-series ingestion for device data, supporting
            both Python and Go controllers during migration. Tuned InfluxDB
            indexes and queries to keep memory use within edge-device limits.
            The component later grew to support external InfluxDB versions
            and TimescaleDB.
          - >-
            Designed and built external access through a NATS reverse proxy
            with TLS, custom authentication, and configurable topics.
            Enabled standard NATS clients to connect without the
            performance cost and custom client code required by the gRPC option.
          - >-
            Designed and built device-data publishing and analytics components
            in Go, C++, and Python. The early analytics design remains in use
            without major architectural changes.
      - company: Sberbank Technology
        position: Senior Software Engineer
        start_date: 2015-08
        end_date: 2017-11
        summary: Internal financial risk calculation platform.
        highlights:
          - >-
            Replaced Jenkins-based job execution with a Python/Tornado backend
            for orchestration, authentication, and API access. Used
            MongoDB/GridFS for file handling.
          - >-
            Migrated the C++ calculation engine from Windows to Linux,
            reworking platform-dependent and parallel-processing code to
            integrate with the department's Linux infrastructure.
          - >-
            Developed product features and calculation methods with financial
            domain specialists, using C++, Eigen, Boost, and QuantLib.
      - company: NIPK Electron
        position: Software Developer
        start_date: 2012-03
        end_date: 2015-08
        summary: Distributed PACS / medical imaging platform deployed in hospitals.
        highlights:
          - >-
            Contributed to C++/Qt services for DICOM/HL7, replicated image
            storage, authentication, and node coordination in a multi-node
            medical archive.
          - >-
            Built testing, administration, and deployment tools for Linux and
            Windows using C++ and Python; worked with PostgreSQL and LMDB.
      - company: Bank Otkritie
        position: Junior Software Engineer → Software Engineer
        start_date: 2008-08
        end_date: 2012-03
        highlights:
          - >-
            Developed banking applications, client messaging systems, and
            internal tools using C++ and SQL.
    technical_skills:
      - label: Languages
        details: Go (Golang), C++, Python, SQL
      - label: Distributed systems
        details: Concurrency, data pipelines, persistent buffering and recovery, backward-compatible storage and API migrations
      - label: APIs & messaging
        details: gRPC, REST, GraphQL, MQTT, NATS, Kafka
      - label: Data & storage
        details: PostgreSQL (pgx, sqlc), TimescaleDB, InfluxDB, Redis, BoltDB, BadgerDB, LMDB, MongoDB/GridFS
      - label: Observability
        details: OpenTelemetry, Prometheus, Grafana, Jaeger, VictoriaMetrics
      - label: Infrastructure & testing
        details: Linux, Docker, Kubernetes, AWS, GitLab CI/CD, Testcontainers, integration testing
    education:
      - institution: St. Petersburg State University of Aerospace Instrumentation
        area: Information Systems
        degree: Master's
        start_date: 2009
        end_date: 2011
      - institution: St. Petersburg State University of Aerospace Instrumentation
        area: Information Systems
        degree: Bachelor's
        start_date: 2005
        end_date: 2009

design:
  theme: classic
  page:
    size: a4
    top_margin: 1.5cm
    bottom_margin: 1.5cm
    left_margin: 1.5cm
    right_margin: 1.5cm
    show_top_note: false
  colors:
    name: '#165b57'
    headline: '#165b57'
    connections: '#165b57'
    section_titles: '#165b57'
    links: '#165b57'
  typography:
    alignment: left
    font_size:
      body: 10pt
      name: 26pt
      headline: 10pt
      connections: 9pt
  header:
    space_below_name: 0.25cm
    space_below_headline: 0.25cm
    space_below_connections: 0.35cm
    connections:
      show_icons: false
      display_urls_instead_of_usernames: true
  entries:
    allow_page_break: true
    date_and_location_width: 3cm
  sections:
    space_between_regular_entries: 1em
  templates:
    education_entry:
      # Full degree names do not fit the classic theme's narrow degree column.
      degree_column: null
      main_column: |-
        **INSTITUTION**
        DEGREE degree in AREA
        SUMMARY
        HIGHLIGHTS
locale:
  language: english
settings:
  current_date: today
  render_command:
    output_folder: rendercv_output
    pdf_path: OUTPUT_FOLDER/vladislav-troinich-cv.pdf
    dont_generate_png: true
    dont_generate_html: true
    dont_generate_markdown: true
  pdf_title: Vladislav Troinich — CV
