hero:
  eyebrow: "Distributed systems · Data platforms · Go & C++"
  title: "Staff / Lead Software Engineer"
  summary: >-
    Software engineer with 18+ years of experience, from C++ systems to Go
    data platforms. My work spans distributed storage, messaging, and data
    processing, combining architecture and technical leadership with
    implementation and performance analysis.
  signals:
    - "Remote worldwide"
    - "B2B preferred"
    - "UTC+4 · US/EU overlap"

experience:
  title: "Work experience"
  items:
    - role: "Lead Software Engineer"
      company: "Litmus Automation"
      period: "Oct 2020 — present"
      label: "Industrial edge and data systems"
      description: >-
        I lead technical work across a data engineering group of about nine engineers,
        including two technical leads. My scope spans collection, processing,
        storage, and delivery: reviewing architecture and data models,
        defining internal gRPC and external GraphQL APIs, and implementing
        changes across services.
      details:
        - >-
          As the platform grew, I replaced centralized cloud delivery with
          independent connectors and recoverable disk buffers, while preserving
          compatibility with older deployments. Other work included MQTT
          clustering and a redesign of distributed delivery, plus migrating
          embedded storage from BoltDB to BadgerDB with schema and index changes.
        - >-
          Performance work spans CPU, memory, startup time, and throughput in
          device polling, OPC UA, analytics, and connectors. To make changes
          more consistent across the group, I standardized Go service structure
          and shared libraries and introduced container-based integration
          testing, later adopting Testcontainers.
    - role: "Senior Software Engineer"
      company: "Litmus Automation"
      period: "Nov 2017 — Oct 2020"
      label: "Industrial connectivity and storage"
      description: >-
        Joined early in the platform's development and took the device-collection
        stack from its original Python implementation to a Go controller with
        Go/C++ workers. The controller → worker → driver architecture I designed
        in 2018 remains the foundation for all 250+ industrial drivers.
      details:
        - >-
          My work extended from collection into device-data publishing,
          time-series storage integration, and analytics pipelines. The early
          analytics design remains in use without major architectural redesign.
    - role: "Senior Software Engineer"
      company: "Sberbank Technology"
      period: "Aug 2015 — Nov 2017"
      label: "Financial risk calculation"
      description: >-
        Developed C++ financial calculation software with domain specialists
        and reworked the surrounding service architecture. Replaced
        Jenkins-based job execution with a Python/Tornado backend for
        orchestration, authentication, and APIs, using MongoDB/GridFS for files.
      details:
        - >-
          Migrated the calculation engine from Windows to Linux, reworking
          platform-dependent and parallel-processing code to fit the
          department's infrastructure.
    - role: "Software Developer"
      company: "NIPK Electron"
      period: "Mar 2012 — Aug 2015"
      label: "Distributed medical imaging"
      description: >-
        Contributed to a distributed C++/Qt medical-image archive deployed
        with X-ray equipment in hospitals. Worked on DICOM/HL7 services,
        replicated writes, node coordination, and authentication, alongside
        administration, testing, and deployment tools for Linux and Windows.
        This was the foundation of my experience with asynchronous services
        and distributed storage.
    - role: "Junior Software Engineer → Software Engineer"
      company: "Bank Otkritie"
      period: "Aug 2008 — Mar 2012"
      label: "Banking applications"
      description: >-
        Started in part-time development and progressed to a software engineer
        role, building C++/SQL banking applications, client messaging systems,
        and internal tools.

